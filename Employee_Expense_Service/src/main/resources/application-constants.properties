# Application Constants Configuration File
# This file contains all hardcoded values used across the Employee Expense Service

# Expense Status Constants
app.expense.status.requested=Requested
app.expense.status.inprogress=Inprogress
app.expense.status.approved=Approved
app.expense.status.rejected=Rejected
app.expense.status.reimbursed=Reimbursed

# Expense Categories
app.expense.category.hardware=hardware
app.expense.category.food=food
app.expense.category.certification=certification
app.expense.category.travel=travel
app.expense.category.accommodation=accommodation

# Currency Constants
app.currency.base=INR
app.currency.usd=USD
app.currency.eur=EUR

# API Endpoints
app.api.version=/api/v1
app.api.employee=/api/v1/employee
app.api.admin=/api/v1/admin

# Cache Constants
app.cache.currency.prefix=currency_rate:
app.cache.currency.ttl=3600

# JWT Constants
app.jwt.header=Authorization
app.jwt.prefix=Bearer 

# Error Messages
app.message.expense.not.found=Expense not found
app.message.category.not.found=Expense category not found
app.message.unauthorized.access=Unauthorized access
app.message.invalid.status.transition=Invalid status transition
app.message.currency.conversion.failed=Currency conversion failed

# Success Messages
app.message.expense.created.success=Expense created successfully
app.message.expense.updated.success=Expense updated successfully
app.message.expense.deleted.success=Expense deleted successfully

# Validation Constants
app.validation.currency.pattern=USD|EUR|INR
app.validation.amount.min=0.01
app.validation.description.max=500
app.validation.amount.digits.integer=8
app.validation.amount.digits.fraction=2

# Validation Messages
app.validation.message.employee.id.required=Employee ID is required
app.validation.message.category.id.required=Expense category ID is required
app.validation.message.currency.required=Currency is required
app.validation.message.currency.invalid=Currency must be USD, EUR, or INR
app.validation.message.amount.required=Amount is required
app.validation.message.amount.min=Amount must be greater than 0
app.validation.message.amount.format=Amount format is invalid
app.validation.message.description.required=Description is required
app.validation.message.description.max=Description cannot exceed 500 characters
app.validation.message.date.required=Date of expense is required
app.validation.message.date.future=Date of expense cannot be in the future

# ExpenseUpdateDto Validation Constants
app.validation.status.pattern=Requested|Inprogress|Approved|Rejected|Reimbursed
app.validation.message.status.required=Status is required
app.validation.message.status.invalid=Status must be one of: Requested, Inprogress, Approved, Rejected, Reimbursed