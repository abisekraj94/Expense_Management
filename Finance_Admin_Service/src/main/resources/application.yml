spring:
  application:
    name: finance-admin-service
  main:
    allow-circular-references: true
  
  datasource:
    url: jdbc:postgresql://localhost:5432/Expense_Reimburse
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:abisek}
    driver-class-name: org.postgresql.Driver
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:abisekideas2it@gmail.com}
    password: ${MAIL_PASSWORD:riyo zhio bsfx wobu}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8082
  servlet:
    context-path: /api/v1

logging:
  level:
    com.finance.admin: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/finance-admin-service.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always