spring:
  application:
    name: finance-admin-service
  
  datasource:
    url: jdbc:postgresql://localhost:5432/finance_admin_db
    username: ${DB_USERNAME:finance_admin}
    password: ${DB_PASSWORD:admin123}
    driver-class-name: org.postgresql.Driver
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:finance@company.com}
    password: ${MAIL_PASSWORD:mailpassword}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            
server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /api/v1

logging:
  level:
    com.finance.admin: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/finance-admin-service.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always