# Application Constants
app.name=Finance Admin Service
app.version=1.0.0
app.description=Finance Admin Approval Workflow Microservice
app.author=Finance Team



# Currency API Configuration
currency.api.url=https://api.exchangerate-api.com/v4/latest/
currency.api.timeout=5000
currency.base.currency=INR
currency.default.usd.rate=83.00
currency.default.eur.rate=90.00
currency.default.gbp.rate=105.00
currency.precision=6
currency.amount.precision=2

# Email Configuration
email.from=${EMAIL_FROM:finance@company.com}
email.template.approval=approval-notification
email.template.rejection=rejection-notification
email.subject.approval=Expense Approved
email.subject.rejection=Expense Rejected
email.company.name=Company Name
email.support.email=finance-team@company.com

# Pagination Configuration
pagination.default.page=0
pagination.default.size=10
pagination.max.size=100
pagination.report.default.size=5

# Employee Service Configuration
employee.service.url=${EMPLOYEE_SERVICE_URL:http://localhost:8080/api/v1}
employee.service.timeout=10000

# Expense Status Constants
expense.status.pending=PENDING
expense.status.approved=APPROVED
expense.status.rejected=REJECTED

# Audit Configuration
audit.created.by=SYSTEM
audit.updated.by=SYSTEM

# Report Configuration
report.max.employees=5
report.date.format=yyyy-MM-dd
report.currency.precision=2
report.default.months.back=1

# Security Configuration
security.role.finance.admin=FINANCE_ADMIN
security.role.prefix=ROLE_
security.password.encoder.strength=10

# Database Configuration
db.schema.finance.admins=finance_admins
db.schema.employees=employees
db.schema.expenses=expenses

# Field Lengths
field.length.username.min=3
field.length.username.max=50
field.length.password.min=8
field.length.name.max=100
field.length.email.max=150
field.length.description.max=500
field.length.currency=3
field.length.department.max=50
field.length.designation.max=50
field.length.role.max=50
field.length.rejection.reason.max=1000
field.precision.amount.integer=10
field.precision.amount.fraction=2
field.precision.exchange.rate.integer=10
field.precision.exchange.rate.fraction=6

# Validation Messages
validation.expense.id.required=Expense ID is required
validation.reason.required=Rejection reason is required
validation.reason.max.length=Rejection reason cannot exceed 1000 characters
validation.email.invalid=Invalid email format
validation.amount.positive=Amount must be positive
validation.date.future=Date cannot be in future
validation.username.required=Username is required
validation.password.required=Password is required
validation.username.min.length=Username must be at least 3 characters
validation.username.max.length=Username cannot exceed 50 characters
validation.password.min.length=Password must be at least 8 characters
validation.name.required=Name is required
validation.name.max.length=Name cannot exceed 100 characters
validation.email.required=Email is required
validation.email.max.length=Email cannot exceed 150 characters
validation.description.required=Description is required
validation.description.max.length=Description cannot exceed 500 characters
validation.currency.required=Currency is required
validation.currency.length=Currency must be 3 characters
validation.amount.required=Amount is required
validation.amount.digits=Amount format is invalid
validation.expense.date.required=Expense date is required
validation.department.max.length=Department cannot exceed 50 characters
validation.designation.max.length=Designation cannot exceed 50 characters
validation.role.max.length=Role cannot exceed 50 characters

# Error Messages
error.resource.not.found=Resource not found
error.business.rule.violation=Business rule violation
error.authentication.failed=Authentication failed
error.validation.failed=Validation failed
error.internal.server.error=Internal server error
error.expense.not.pending=Expense is not in pending status
error.admin.account.inactive=Admin account is inactive
error.invalid.credentials=Invalid username or password
error.invalid.token=Invalid token
error.max.employees.exceeded=Maximum {0} employees allowed for report
error.currency.conversion.failed=Failed to convert currency
error.email.send.failed=Failed to send email

# Success Messages
success.expense.approved=Expense approved successfully
success.expense.rejected=Expense rejected successfully
success.login.successful=Login successful
success.email.sent=Email sent successfully

# HTTP Configuration
http.timeout.connect=5000
http.timeout.read=10000
http.max.memory.size=1048576

# Logging Configuration
log.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
log.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
log.file.name=logs/finance-admin-service.log

# API Documentation
api.docs.title=Finance Admin Service API
api.docs.description=RESTful API for Finance Admin Approval Workflow
api.docs.version=1.0.0
api.docs.contact.name=Finance Team
api.docs.contact.email=finance-team@company.com

# Default Values
default.admin.role=FINANCE_ADMIN
default.admin.active=true
default.entity.deleted=false
default.exchange.rate=1.00
default.currency.inr=INR
default.currency.usd=USD
default.currency.eur=EUR
default.currency.gbp=GBP