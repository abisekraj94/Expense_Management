# Application Configuration
spring.application.name=employee-expense-management
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=abisek
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Repository Configuration
spring.data.jpa.repositories.enabled=true
spring.data.redis.repositories.enabled=false

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=abisekideas2it@gmail.com
spring.mail.password=riyo zhio bsfx wobu
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true



# External API Configuration
app.currency.api.base-url=https://open.er-api.com/v6/latest
app.currency.cache.ttl=3600

# Pagination Configuration
app.pagination.default-page-size=10
app.pagination.max-page-size=100

# User Management Service Configuration
user.management.base-url=http://localhost:8081
user.management.login.endpoint=/api/auth/login
user.management.timeout=5000
user.management.fallback-enabled=true
user.management.retry.max-attempts=3
user.management.retry.delay=1000

# Feign Client Configuration
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=5000
spring.cloud.openfeign.client.config.user-management.connect-timeout=${user.management.timeout:5000}
spring.cloud.openfeign.client.config.user-management.read-timeout=${user.management.timeout:5000}
feign.hystrix.enabled=true
feign.circuitbreaker.enabled=true

# Logging Configuration
logging.level.com.expense=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Spring Cloud Configuration
spring.cloud.compatibility-verifier.enabled=false

# JPA Configuration for handling existing data
spring.jpa.hibernate.ddl-auto=update
