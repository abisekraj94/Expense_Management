spring.application.name=user-management

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=abisek
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=60000

# JWT Configuration
jwt.secret=${JWT_SECRET:mySecretKey1234567890123456789012345678901234567890123456789012345}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Server Configuration
server.port=8081

# Logging Configuration
logging.level.com.usermanagement=DEBUG
logging.level.com.user.management=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.data.redis=DEBUG

# Finance Service Configuration
finance.service.base-url=http://localhost:8080/api/v1

# Authentication Constants
auth.header.name=Authorization
auth.token.prefix=Bearer 
auth.redis.token.prefix=jwt_token:
auth.token.ttl=3600

# Role Constants
role.employee=EMPLOYEE
role.admin=ADMIN
