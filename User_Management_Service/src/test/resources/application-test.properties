# Test Configuration for User Management Service
spring.application.name=user-management-service-test

# PostgreSQL Test Database (Testcontainers will override these)
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration for Testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:sql/init.sql

# Redis Configuration for Testing (Embedded)
spring.data.redis.host=localhost
spring.data.redis.port=6370
spring.data.redis.timeout=2000ms

# JWT Configuration for Testing
app.jwt.secret=TestSecretKeyForJWTTokenGenerationAndValidation123456789
app.jwt.expiration=3600000

# Logging Configuration for Testing
logging.level.com.usermgmt.usermanagement=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# Disable Actuator for Testing
management.endpoints.enabled-by-default=false